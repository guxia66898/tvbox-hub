name: "tvbox-hub daily run"

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run hub
        run: |
          CONFIG=config.json
          [ -f "$CONFIG" ] || CONFIG=config.example.json
          python run.py --config $CONFIG

      - name: Commit artifacts
        run: |
          git config user.name 'tvbox-hub-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add dist history
          git diff --cached --quiet || (git commit -m "hub: daily run $(date -u +%F)" && git push)

      - name: Upload dist artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
